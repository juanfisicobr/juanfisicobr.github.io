<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Análise Interativa de Feedback</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; font-weight: 600; }
        .code-link { color: #1a73e8; text-decoration: none; cursor: pointer; font-weight: bold; padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
        .code-link:hover { background-color: #e8f0fe; text-decoration: underline; }
        #display-area { 
            padding: 20px; border-left: 5px solid #1a73e8; background: #fdfdfd; 
            margin-top: 30px; display: none; border-radius: 4px; animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .footer { margin-top: 40px; font-size: 0.8em; color: #666; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Eixo Temático 1: Gestão de Feedback</h2>
    <p>Selecione um código abaixo para visualizar o depoimento completo extraído do corpus.</p>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Resumo da Unidade de Registro</th>
                <th>Categoria</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <div id="display-area">
        <strong id="display-id" style="color: #1a73e8;"></strong>
        <p id="full-text" style="font-style: italic; font-size: 1.1em; margin-top: 10px;"></p>
    </div>

    <div class="footer">
        Base de dados: Iramuteq_africa_portugal_brasil.txt | Arquivo de suporte: dados.json
    </div>
</div>

<script>
    // Lista de dados para a tabela de Feedback
    const feedbackList = [
        { id: "10P.12", summary: "Responsabilidade ética no feedback", cat: "Individualizada" },
        { id: "10P.13", summary: "Feedback atempado e acompanhamento", cat: "Individualizada" },
        { id: "1P.1", summary: "Dificuldade com volume de orientandos", cat: "Individualizada" },
        { id: "10P.15", summary: "Uso de legenda de cores no texto", cat: "Individualizada" },
        { id: "10P.19", summary: "Relação de confiança orientador-orientando", cat: "Individualizada" },
        { id: "3A.16", summary: "Feedback coletivo e simultâneo", cat: "Coletiva" },
        { id: "12P.29", summary: "Uso de gravação para treino do aluno", cat: "Hibridização" },
        { id: "7B.7", summary: "Feedback via pasta compartilhada (nuvem)", cat: "Hibridização" }
    ];

    let fullParagraphs = {};

    // Carrega o arquivo JSON gerado
    fetch('dados.json')
        .then(response => response.json())
        .then(data => {
            fullParagraphs = data;
            const tbody = document.getElementById('table-body');
            feedbackList.forEach(item => {
                const row = `<tr>
                    <td><a class="code-link" onclick="showText('${item.id}')">${item.id}</a></td>
                    <td>${item.summary}</td>
                    <td>${item.cat}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });

    function showText(id) {
        const area = document.getElementById('display-area');
        const textContent = document.getElementById('full-text');
        const idLabel = document.getElementById('display-id');
        
        if (fullParagraphs[id]) {
            idLabel.innerText = "Texto Completo (Código " + id + "):";
            textContent.innerText = "“" + fullParagraphs[id] + "”";
            area.style.display = 'block';
            window.scrollTo({ top: area.offsetTop - 50, behavior: 'smooth' });
        } else {
            alert("Aviso: O texto para o código " + id + " não foi encontrado no arquivo.");
        }
    }
</script>

</body>
</html>
