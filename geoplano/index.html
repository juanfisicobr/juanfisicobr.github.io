<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoplano Virtual</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            user-select: none;
            touch-action: none;
        }
        h1 { color: #2c3e50; margin: 5px 0; font-size: 28px; }
        p { color: #576574; font-size: 14px; max-width: 500px; text-align: center; line-height: 1.5; margin-bottom: 15px; }

        .panel-controle { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }

        .btn-forma {
            background-color: #34495e;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .btn-forma:hover { background-color: #2c3e50; transform: translateY(-1px); }

        /* Estilo para botão ativo */
        .btn-forma.active {
            background-color: #e74c3c !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #tabuleiro {
            background-color: #e0d0b0;
            border: 5px solid #8b5a2b;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>Geoplano Multi-Formas</h1>
    <p>Selecione uma forma para manipular.</p>

    <div class="panel-controle">
        <button id="btn-triangulo" class="btn-forma active" onclick="configurarForma('triangulo', this)">Triângulo</button>
        <button id="btn-quadrado" class="btn-forma" onclick="configurarForma('quadrado', this)">Quadrado</button>
        <button id="btn-pentagono" class="btn-forma" onclick="configurarForma('pentagono', this)">Pentágono</button>
        <button id="btn-hexagono" class="btn-forma" onclick="configurarForma('hexagono', this)">Hexágono</button>
    </div>

    <canvas id="tabuleiro" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('tabuleiro');
        const ctx = canvas.getContext('2d');
        const pinos = [];
        const espacamento = 80, margem = 40;
        
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                pinos.push({ x: margem + i * espacamento, y: margem + j * espacamento });
            }
        }

        const verticesElasticos = [];
        let verticeArrastadoIndex = null;

        function configurarForma(tipo, btnElemento) {
            // 1. Lógica de troca de cor dos botões
            document.querySelectorAll('.btn-forma').forEach(btn => btn.classList.remove('active'));
            btnElemento.classList.add('active');

            // 2. Lógica de desenho
            verticesElasticos.length = 0;
            if (tipo === 'triangulo') verticesElasticos.push(0, 10, 12);
            else if (tipo === 'quadrado') verticesElasticos.push(6, 8, 18, 16);
            else if (tipo === 'pentagono') verticesElasticos.push(10, 22, 19, 9, 2);
            else if (tipo === 'hexagono') verticesElasticos.push(5, 15, 22, 19, 9, 2);
            
            desenharGeoplano();
        }

        function desenharGeoplano() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(pinos[verticesElasticos[0]].x, pinos[verticesElasticos[0]].y);
            for (let i = 1; i < verticesElasticos.length; i++) ctx.lineTo(pinos[verticesElasticos[i]].x, pinos[verticesElasticos[i]].y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(231, 76, 60, 0.25)'; ctx.fill();
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 6; ctx.stroke();

            verticesElasticos.forEach(idx => {
                ctx.beginPath(); ctx.arc(pinos[idx].x, pinos[idx].y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#e74c3c'; ctx.fill();
            });

            pinos.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#2c3e50'; ctx.fill();
            });
        }
        
        // Mantive a lógica de arrasto, apenas simplifiquei a chamada
        configurarForma('triangulo', document.getElementById('btn-triangulo'));
    </script>
</body>
</html>
