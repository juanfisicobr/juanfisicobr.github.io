<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoplano Virtual</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            user-select: none;
            touch-action: none;
        }
        h1 { color: #2c3e50; margin: 5px 0; font-size: 28px; }
        p { color: #576574; font-size: 14px; max-width: 500px; text-align: center; line-height: 1.5; margin-bottom: 15px; }

        .panel-controle { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }

        .btn-forma {
            background-color: #34495e;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .btn-forma:hover { background-color: #2c3e50; transform: translateY(-1px); }

        /* Estilo para botão ativo */
        .btn-forma.active {
            background-color: #e74c3c !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #tabuleiro {
            background-color: #e0d0b0;
            border: 5px solid #8b5a2b;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>Geoplano Multi-Formas</h1>
    <p>Selecione uma forma para manipular.</p>

    <div class="panel-controle">
        <button id="btn-triangulo" class="btn-forma active" onclick="configurarForma('triangulo', this)">Triângulo</button>
        <button id="btn-quadrado" class="btn-forma" onclick="configurarForma('quadrado', this)">Quadrado</button>
        <button id="btn-pentagono" class="btn-forma" onclick="configurarForma('pentagono', this)">Pentágono</button>
        <button id="btn-hexagono" class="btn-forma" onclick="configurarForma('hexagono', this)">Hexágono</button>
    </div>

    <canvas id="tabuleiro" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('tabuleiro');
        const ctx = canvas.getContext('2d');
        const colunas = 5, linhas = 5, espacamento = 80, margem = 40;
        const pinos = [];
        for (let i = 0; i < colunas; i++) {
            for (let j = 0; j < linhas; j++) {
                pinos.push({ x: margem + i * espacamento, y: margem + j * espacamento, raio: 6 });
            }
        }

        const verticesElasticos = [];
        let verticeArrastadoIndex = null;

        function configurarForma(tipo) {
            verticesElasticos.length = 0;
            if (tipo === 'triangulo') verticesElasticos.push(0, 10, 12);
            else if (tipo === 'quadrado') verticesElasticos.push(6, 8, 18, 16);
            else if (tipo === 'pentagono') verticesElasticos.push(10, 22, 19, 9, 2);
            else if (tipo === 'hexagono') verticesElasticos.push(5, 15, 22, 19, 9, 2);
            
            document.getElementById('num-pontos-txt').innerText = verticesElasticos.length;
            desenharGeoplano();
        }

        function desenharGeoplano() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(pinos[verticesElasticos[0]].x, pinos[verticesElasticos[0]].y);
            for (let i = 1; i < verticesElasticos.length; i++) ctx.lineTo(pinos[verticesElasticos[i]].x, pinos[verticesElasticos[i]].y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(231, 76, 60, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 6;
            ctx.stroke();

            verticesElasticos.forEach(idx => {
                ctx.beginPath();
                ctx.arc(pinos[idx].x, pinos[idx].y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
            });

            pinos.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                ctx.fillStyle = '#2c3e50';
                ctx.fill();
            });
        }

        function obterCoordenadas(e) {
            const rect = canvas.getBoundingClientRect();
            // Verifica se é toque ou clique
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function iniciarArrasto(e) {
            const pos = obterCoordenadas(e);
            verticesElasticos.forEach((pinoIdx, i) => {
                const p = pinos[pinoIdx];
                if (Math.hypot(pos.x - p.x, pos.y - p.y) < 30) verticeArrastadoIndex = i;
            });
        }

        function arrastar(e) {
            if (verticeArrastadoIndex === null) return;
            const pos = obterCoordenadas(e);
            let maisProximo = 0, menorDist = Infinity;
            pinos.forEach((p, i) => {
                const d = Math.hypot(pos.x - p.x, pos.y - p.y);
                if (d < menorDist) { menorDist = d; maisProximo = i; }
            });
            if (menorDist < 60) {
                verticesElasticos[verticeArrastadoIndex] = maisProximo;
                desenharGeoplano();
            }
        }

        // Eventos Unificados
        canvas.addEventListener('mousedown', iniciarArrasto);
        window.addEventListener('mousemove', arrastar);
        window.addEventListener('mouseup', () => verticeArrastadoIndex = null);

        canvas.addEventListener('touchstart', (e) => {
            iniciarArrasto(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (verticeArrastadoIndex !== null) e.preventDefault(); // Bloqueia scroll apenas ao arrastar
            arrastar(e);
        }, { passive: false });

        configurarForma('triangulo');
    </script>
</body>
</html>
